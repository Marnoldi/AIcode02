<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>파리 크기 조절기</title>
    <style>
        /* 검은색 배경 및 UI 스타일 정의 */
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        select, input {
            padding: 10px;
            font-size: 16px;
            margin: 10px;
            border-radius: 5px;
        }
        .image-box {
            margin: 30px auto;
            min-height: 550px; /* 큰 크기 대응을 위해 세로 영역 확보 */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 기본 이미지 스타일 (너비 기준 조절) */
        #fly-image {
            width: 200px; 
            transition: width 0.1s ease;
        }
        #status-message {
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 30px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🪰 파리 크기 조절 시뮬레이터</h1>

    <!-- 1. 파리 선택 메뉴 (data-scale 속성으로 고유 비율 지정) -->
    <label for="fly-select">파리 선택:</label>
    <select id="fly-select" onchange="updateFly()">
        <option value="frutfly.png" data-scale="1.0">초파리 (기본 1.0)</option>
        <option value="벼룩팔이.png" data-scale="0.8">벼룩파리 (기본 0.8)</option>
        <option value="arnoldimale.png" data-scale="0.2">Megapropodiphora arnoldi (기본 0.2)</option>
    </select>

    <br>

    <!-- 2. 크기 조절 슬라이더 -->
    <label for="size-slider">크기 조절:</label>
    <input type="range" id="size-slider" min="50" max="500" value="200" oninput="changeSize(this.value)">

    <!-- 3. 이미지 출력 영역 -->
    <div class="image-box">
        <img id="fly-image" src="frutfly.png" alt="파리 이미지">
    </div>

    <!-- 4. 상태 메시지 출력 영역 -->
    <div id="status-message">일반 상태입니다.</div>
</div>

<script>
    // 파리 종류가 변경될 때 호출되는 함수
    function updateFly() {
        const select = document.getElementById('fly-select');
        const img = document.getElementById('fly-image');
        const slider = document.getElementById('size-slider');
        
        // 이미지 소스 변경
        img.src = select.value; 
        
        // 파리가 바뀌어도 현재 슬라이더 값에 맞춰 크기 비율 재계산
        changeSize(slider.value);
    }

    // 슬라이더를 움직이거나 파리가 바뀔 때 크기와 상태를 계산하는 함수
    function changeSize(sliderValue) {
        const select = document.getElementById('fly-select');
        const img = document.getElementById('fly-image');
        const status = document.getElementById('status-message');
        
        // 현재 선택된 파리의 고유 배율 가져오기 (기본값 1.0)
        const selectedOption = select.options[select.selectedIndex];
        const scale = parseFloat(selectedOption.getAttribute('data-scale')) || 1.0;
        const currentFlyName = selectedOption.text.split(' ')[0]; // '초파리', '벼룩파리', 'Megapropodiphora' 추출
        
        // 슬라이더 값에 고유 배율을 곱해 최종 크기(px) 결정
        const finalSize = parseInt(sliderValue) * scale;
        img.style.width = finalSize + 'px';

        // --- 💡 파리별 거대화 / 축소화 기준 설정 ---
        let minThreshold, maxThreshold;

        if (currentFlyName === "초파리") {
            minThreshold = 100; // 100px 미만일 때 축소
            maxThreshold = 350; // 350px 초과일 때 거대
        } else if (currentFlyName === "벼룩파리") {
            minThreshold = 80;  // 80px 미만일 때 축소 (배율 0.8 반영)
            maxThreshold = 280; // 280px 초과일 때 거대
        } else { 
            // Megapropodiphora arnoldi (배율 0.2로 매우 작음)
            minThreshold = 15;  // 15px 미만일 때 축소
            maxThreshold = 80;  // 80px 초과일 때 거대 (슬라이더를 많이 키우면 거대화 돌입)
        }

        // --- 상태 메시지 판정 및 출력 ---
        if (finalSize > maxThreshold) {
            status.textContent = `⚠️ 거대화 상태 (${Math.round(finalSize)}px): 에너지 소비가 극심하여 저전력 동면 모드에 진입합니다.`;
            status.style.color = "#ff4d4d"; // 빨간색
        } else if (finalSize < minThreshold) {
            status.textContent = `🔍 축소화 상태 (${Math.round(finalSize)}px): 원자 수준으로 작아져 생명 신호가 미약합니다.`;
            status.style.color = "#222272"; // 파란색
        } else {
            status.textContent = `🌱 일반 상태입니다. (${Math.round(finalSize)}px)`;
            status.style.color = "white"; // 흰색
        }
    }

    // 초기 실행 시 슬라이더 값(200)에 맞게 크기 동기화
    window.onload = function() {
        changeSize(document.getElementById('size-slider').value);
    };
</script>

</body>
</html>
