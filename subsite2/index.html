<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초파리 가상 시뮬레이션</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: sans-serif;
            color: #fff;
        }
        #controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            z-index: 10;
        }
        button {
            background: #444;
            color: white;
            border: none;
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #666;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="controls">
        <h3>초파리 시뮬레이터</h3>
        <p>초파리 수: <span id="count">30</span>마리</p>
        <button onclick="changeSize(0.5)">크기 줄이기 (0.5x)</button>
        <button onclick="changeSize(1.0)">크기 복원 (1.0x)</button>
        <p style="font-size: 12px; color: #aaa;">* 화면을 클릭하면 그곳으로 초파리들이 반응합니다.</p>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // 화면 크기 설정
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 글로벌 변수
        let sizeMultiplier = 1.0; // 크기 배율
        const flies = [];
        const numFlies = 30;
        let target = { x: canvas.width / 2, y: canvas.height / 2 };

        // 마우스 클릭 시 목표 지점 변경
        window.addEventListener('click', (e) => {
            target.x = e.clientX;
            target.y = e.clientY;
        });

        // 초파리 클래스 정의 (간단한 신경망/조조향 행동 모델 반영)
        class FruitFly {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.baseRadius = 4; // 기본 크기
                this.angle = Math.random() * Math.PI * 2;
            }

            // 의사 신경망 행동 계산 (자극 인지 및 반응)
            update() {
                // 1. 센서 역할: 목표물(음식/자극)과의 거리와 각도 계산
                const dx = target.x - this.x;
                const dy = target.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                // 2. 가중치 반응: 가까워질수록 강하게 끌림 (단, 무작위 비행 본능도 결합)
                if (distance > 10) {
                    this.vx += (dx / distance) * 0.2 + (Math.random() - 0.5) * 0.5;
                    this.vy += (dy / distance) * 0.2 + (Math.random() - 0.5) * 0.5;
                } else {
                    // 목표물에 도달하면 무작위로 방황
                    this.vx += (Math.random() - 0.5) * 1;
                    this.vy += (Math.random() - 0.5) * 1;
                }

                // 속도 제한 (속도가 너무 빨라지지 않게 조절)
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const maxSpeed = 3;
                if (speed > maxSpeed) {
                    this.vx = (this.vx / speed) * maxSpeed;
                    this.vy = (this.vy / speed) * maxSpeed;
                }

                // 위치 업데이트
                this.x += this.vx;
                this.y += this.vy;

                // 벽에 부딪히면 튕기기
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                // 진행 방향 각도 계산
                this.angle = Math.atan2(this.vy, this.vx);
            }

            // 그리기 (크기 배율 반영)
            draw() {
                const currentRadius = this.baseRadius * sizeMultiplier;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // 초파리 몸통
                ctx.beginPath();
                ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
                ctx.fillStyle = '#b5835a';
                ctx.fill();

                // 초파리 눈 (붉은색)
                ctx.beginPath();
                ctx.arc(currentRadius * 0.8, -currentRadius * 0.4, currentRadius * 0.3, 0, Math.PI * 2);
                ctx.arc(currentRadius * 0.8, currentRadius * 0.4, currentRadius * 0.3, 0, Math.PI * 2);
                ctx.fillStyle = '#ff3333';
                ctx.fill();

                // 날개 (반투명)
                ctx.beginPath();
                ctx.ellipse(-currentRadius * 0.5, -currentRadius * 0.8, currentRadius * 0.6, currentRadius * 1.2, Math.PI / 4, 0, Math.PI * 2);
                ctx.ellipse(-currentRadius * 0.5, currentRadius * 0.8, currentRadius * 0.6, currentRadius * 1.2, -Math.PI / 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.fill();

                ctx.restore();
            }
        }

        // 초파리 객체 생성
        for (let i = 0; i < numFlies; i++) {
            flies.push(new FruitFly());
        }

        // 크기 변경 함수 (버튼 이벤트 연결)
        function changeSize(multiplier) {
            sizeMultiplier = multiplier;
        }

        // 애니메이션 루프
        function loop() {
            // 잔상 효과를 위해 반투명하게 배경을 지움
            ctx.fillStyle = 'rgba(26, 26, 26, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 가상 자극 유인원(음식 등) 표시
            ctx.beginPath();
            ctx.arc(target.x, target.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#ffcc00';
            ctx.fill();

            // 각 초파리 업데이트 및 그리기
            flies.forEach(fly => {
                fly.update();
                fly.draw();
            });

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
