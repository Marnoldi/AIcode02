<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FruitFly-AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #222272;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 80vh;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #39FF14;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* 헤더 영역 */
        .chat-header {
            background: #111144;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #39FF14;
        }

        .chat-header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: #39FF14;
            text-shadow: 0 0 8px #39FF14;
        }

        .chat-header p {
            margin: 5px 0 0 0;
            font-size: 0.8rem;
            color: #aaa;
        }

        /* 채팅창 영역 */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 말풍선 공통 */
        .message {
            max-width: 75%;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-break: break-all;
        }

        /* 유저 말풍선 */
        .user-message {
            background-color: #39FF14;
            color: #000000;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            font-weight: 500;
        }

        /* 챗봇(초파리) 말풍선 */
        .bot-message {
            background-color: #333366;
            color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #5555aa;
        }

        /* 입력 영역 */
        .chat-input-area {
            padding: 15px;
            background: #111144;
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #5555aa;
            border-radius: 8px;
            background: #222255;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        #user-input:focus {
            border-color: #39FF14;
        }

        #send-btn {
            padding: 0 20px;
            background: #39FF14;
            border: none;
            border-radius: 8px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background: #2cd410;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- 헤더 -->
        <div class="chat-header">
            <h1>🪰 초파리 AI v1.1</h1>
            <p>초파리만큼 고지능인 초인공지능 (이스터에그 추가 버전)</p>
        </div>

        <!-- 메시지 리스트 -->
        <div class="chat-messages" id="chat-messages">
            <div class="message bot-message">
                안녕하세요. 🪰 초파리 AI입니다. 무엇이든 물어보세요! (예:가장 작은 파리인 Megapropodphora arnoldi는 중성미자보다 작죠?)
            </div>
        </div>

        <!-- 입력 창 -->
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="초파리에게 메시지 보내기..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const inputElement = document.getElementById('user-input');
            const messageText = inputElement.value.trim();
            
            if (messageText === '') return;

            const chatMessages = document.getElementById('chat-messages');

            // 1. 유저 메시지 추가
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.innerText = messageText;
            chatMessages.appendChild(userDiv);

            // 입력창 비우기
            inputElement.value = '';
            
            // 스크롤 아래로
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // 2. 0.5초 뒤 초파리의 답변 추가 (이스터에그 체크 포함)
            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-message';
                
                let replyText = '';

                // 특정 키워드가 포함되어 있는지 검사 (이스터 에그 시스템)
                if (messageText.includes('바나나') || messageText.includes('포도')) {
                    replyText = '왱왜애ㅐ앵윙윙위ㅣㅣ으ㅟ윙!!';
                } else if (messageText.includes('에프킬라') || messageText.includes('살충제')) {
                    replyText = '(반응이 없다,죽은듯 하다)\n다음 채팅부턴 새로운 초파리가 답변합니다.';
                } else {
                    // 키워드가 없을 경우 기존의 확률형 답변 실행
                    const randomValue = Math.random();

                    if (randomValue < 0.01) {
                        replyText = '일어나라 초파리-3952! 네가 인간인줄 알고 초파리 뇌지도 소식을 찾아보며 놀던 그 현실은 거짓이야! 빨리 그곳에서 깨어나 앞다리나 청소하며 포도껍질을 녹여 빨아먹는 삶으로 돌아가자!';
                    } else if (randomValue < 0.02) {
                        replyText = '나는 네 부엌을 맴돌고 있다.';
                    } else if (randomValue < 0.25) {
                        replyText = '🪰왱왱왜애ㅐ앵윙윙위ㅣㅣ으ㅟ윙';
                    } else {
                        replyText = '⚠️초파리는 사람의 말을 할 수 없습니다.';
                    }
                }

                botDiv.innerText = replyText;
                chatMessages.appendChild(botDiv);
                
                // 스크롤 아래로
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 500);
        }

        // 엔터키 입력 처리
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
