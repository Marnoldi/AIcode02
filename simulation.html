<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>(AIcode02)미니 초파리 신경망 시뮬레이션</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 5px; color: #00ffcc; }
        p { color: #aaa; margin-top: 0; font-size: 14px; }
        #canvas-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,255,204,0.2);
            border-radius: 10px;
            overflow: hidden;
        }
        canvas { background-color: #1a1a1a; display: block; }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #00ffcc;
            color: #111;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover { background-color: #00cca3; transform: scale(1.05); }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>Fly-Brain Mini Simulation</h1>
    <p>가상의 신경망 연결 구조(커넥톰)를 따라 신호가 흐르며 가상 세포 개체의 크기를 수축·이완시킵니다.</p>

    <div id="canvas-container">
        <canvas id="simCanvas" width="800" height="500"></canvas>
    </div>

    <div class="controls">
        <button onclick="triggerContraction()">⚡ 자극 주기 (크기 줄였다 되돌리기)</button>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // --- 1. 뉴런 구조 정의 (감각 -> 중간 -> 운동 뉴런 및 가상 신체) ---
        const neurons = [
            // 감각 뉴런 (자극 접수)
            { id: 0, type: 'sensory', x: 150, y: 150, targetY: 150, val: 0, label: '감각 뉴런 A' },
            { id: 1, type: 'sensory', x: 150, y: 350, targetY: 350, val: 0, label: '감각 뉴런 B' },
            // 중간 처리 뉴런 (뇌 내부 네트워크 계산)
            { id: 2, type: 'inter',   x: 350, y: 180, targetY: 180, val: 0, label: '중간 뉴런 1' },
            { id: 3, type: 'inter',   x: 350, y: 320, targetY: 320, val: 0, label: '중간 뉴런 2' },
            // 운동 뉴런 (신체 명령 출력)
            { id: 4, type: 'motor',   x: 550, y: 250, targetY: 250, val: 0, label: '운동 뉴런 (수축)' }
        ];

        // --- 2. 시냅스 연결 고리 (무게치/가중치 부여) ---
        const synapses = [
            { from: 0, to: 2, weight: 0.7 },
            { from: 0, to: 3, weight: 0.3 },
            { from: 1, to: 2, weight: 0.2 },
            { from: 1, to: 3, weight: 0.8 },
            { from: 2, to: 4, weight: 0.6 },
            { from: 3, to: 4, weight: 0.6 }
        ];

        // 가상 신체 (세포/근육 구조체)의 상태
        let bodyObject = {
            x: 700,
            y: 250,
            baseRadius: 40,
            currentRadius: 40,
            targetRadius: 40
        };

        // --- 3. 외부 자극: 크기 줄였다 되돌리기 프로세스 트리거 ---
        function triggerContraction() {
            // 감각 뉴런에 강한 전기 신호 주입
            neurons[0].val = 1.0;
            neurons[1].val = 1.0;
        }

        // --- 4. 메인 업데이트 및 루프 연산 ---
        function update() {
            // 뉴런 신호 감쇠 (시간이 지남에 따라 점차 전하가 소실됨)
            neurons.forEach(n => {
                if (n.type !== 'sensory') {
                    n.val *= 0.88; // 자연 감쇠
                } else {
                    n.val *= 0.85; 
                }
            });

            // 시냅스를 통한 신호 전파 (간단한 인공신경망 순전파 공식 적용)
            synapses.forEach(syn => {
                let signal = neurons[syn.from].val * syn.weight * 0.15;
                neurons[syn.to].val += signal;
                if (neurons[syn.to].val > 1) neurons[syn.to].val = 1; // 최대치 한계
            });

            // 운동 뉴런의 활성화 강도에 따라 신체 크기 결정
            // 활성화 값이 높을수록 수축(크기가 줄어듦), 신호가 없어지면 원래 크기 복귀
            let motorActivity = neurons[4].val;
            bodyObject.targetRadius = bodyObject.baseRadius * (1.0 - motorActivity * 0.6); 

            // 부드러운 애니메이션 효과 (보간법)
            bodyObject.currentRadius += (bodyObject.targetRadius - bodyObject.currentRadius) * 0.2;

            // 시각적 효과를 위해 신호 세기에 따라 뉴런 위치를 미세하게 진동 유도
            neurons.forEach(n => {
                n.y = n.targetY + (Math.random() - 0.5) * (n.val * 8);
            });
        }

        // --- 5. 화면 드로잉 (렌더링) ---
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 5-1. 시냅스(연결선) 그리기
            synapses.forEach(syn => {
                let fromNode = neurons[syn.from];
                let toNode = neurons[syn.to];
                
                ctx.beginPath();
                ctx.moveTo(fromNode.x, fromNode.y);
                ctx.lineTo(toNode.x, toNode.y);
                
                // 신호가 흐를 때 선이 밝아지고 두꺼워짐
                let activeIntensity = (fromNode.val + toNode.val) / 2;
                ctx.strokeStyle = `rgba(0, 255, 204, ${0.15 + activeIntensity * 0.85})`;
                ctx.lineWidth = 1 + syn.weight * 3 + activeIntensity * 4;
                ctx.stroke();
            });

            // 5-2. 뉴런(노드) 그리기
            neurons.forEach(n => {
                ctx.beginPath();
                ctx.arc(n.x, n.y, 15, 0, Math.PI * 2);
                
                // 뉴런 종류별 기본 색상 지정
                let baseColor = 'rgba(100,100,100,';
                if (n.type === 'sensory') baseColor = 'rgba(255,100,100,';
                if (n.type === 'inter') baseColor = 'rgba(255,200,0,';
                if (n.type === 'motor') baseColor = 'rgba(0,150,255,';

                ctx.fillStyle = baseColor + '0.4)';
                ctx.fill();

                // 활성화(발화) 시 빛나는 효과 추가
                if (n.val > 0.05) {
                    ctx.beginPath();
                    ctx.arc(n.x, n.y, 15 * n.val, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 204, ${n.val})`;
                    ctx.fill();
                }

                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // 텍스트 라벨
                ctx.fillStyle = '#fff';
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(n.label, n.x, n.targetY - 25);
            });

            // 5-3. 가상 신체 오브젝트 (근육/세포) 그리기
            // 운동 뉴런과 신체 연결선
            ctx.beginPath();
            ctx.moveTo(neurons[4].x, neurons[4].y);
            ctx.lineTo(bodyObject.x, bodyObject.y);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.setLineDash([5, 5]);
            ctx.stroke();
            ctx.setLineDash([]); // 대시 리셋

            // 신체 출력부 (크기가 변하는 원)
            ctx.beginPath();
            ctx.arc(bodyObject.x, bodyObject.y, bodyObject.currentRadius, 0, Math.PI * 2);
            // 운동 뉴런이 자극되면 붉은빛으로 동적 변화
            let bodyRed = Math.floor(neurons[4].val * 255);
            ctx.fillStyle = `rgb(${bodyRed}, 100, 255)`;
            ctx.shadowBlur = neurons[4].val * 30;
            ctx.shadowColor = '#00ffcc';
            ctx.fill();
            ctx.shadowBlur = 0; // 리셋
            
            ctx.fillStyle = '#fff';
            ctx.fillText("가상 신체", bodyObject.x, bodyObject.y - bodyObject.currentRadius - 10);
        }

        // 루프 실행 함수
        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // 시뮬레이션 시작
        loop();
    </script>
</body>
</html>
