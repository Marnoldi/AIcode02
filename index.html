<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초파리 뇌 신경망 및 크기 제어 시뮬레이터</title>
    <style>
        body {
            margin: 0;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(22, 27, 34, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
            width: 280px;
        }
        h1 {
            font-size: 16px;
            margin: 0 0 15px 0;
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #8b949e;
        }
        input[type="range"] {
            width: 100%;
            background: #21262d;
            accent-color: #58a6ff;
        }
        .stats {
            font-size: 13px;
            background: #161b22;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #21262d;
            margin-top: 10px;
        }
        .stats div {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .stats div:last-child { margin-bottom: 0; }
        .value { color: #58a6ff; font-weight: bold; }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        .instructions {
            font-size: 11px;
            color: #8b949e;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>Fruit Fly CNS Sim</h1>
        <div class="control-group">
            <label for="sizeSlider">초파리 크기 변형 (Scale)</label>
            <input type="range" id="sizeSlider" min="0.2" max="3.0" step="0.05" value="1.0">
        </div>
        <div class="stats">
            <div><span>스케일:</span> <span id="scaleVal" class="value">1.0x</span></div>
            <div><span>신경 발화율:</span> <span id="firingVal" class="value">Normal</span></div>
            <div><span>가상 시냅스 연동:</span> <span class="value">Active</span></div>
        </div>
        <div class="instructions">
            💡 <b>조작 방법:</b><br>
            - 슬라이더를 조절하거나 화면을 <b>마우스 스크롤</b>하여 크기를 실시간으로 축소/확대할 수 있습니다.
        </div>
    </div>

    <canvas id="simCanvas"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const sizeSlider = document.getElementById('sizeSlider');
        const scaleVal = document.getElementById('scaleVal');
        const firingVal = document.getElementById('firingVal');

        // 창 크기 맞춤
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 상태 변수
        let currentScale = 1.0;
        let targetScale = 1.0;
        let pulseTime = 0;

        // 간이 뉴런 데이터 구조 정의 (초파리 뇌 레이어 시뮬레이션)
        const layers = {
            sensory: [], // 감각계 (눈, 안테나)
            inter: [],   // 중앙 처리계
            motor: []    // 운동계 (다리, 날개 제어)
        };

        // 뉴런 초기화 생성 함수
        function initNeurons() {
            layers.sensory = [];
            layers.inter = [];
            layers.motor = [];

            // 감각 뉴런 (좌측 입력층)
            for(let i=0; i<8; i++) {
                layers.sensory.push({ x: -150, y: -100 + i*30, phase: Math.random() * Math.PI * 2, state: 0 });
            }
            // 중앙 뉴런 (가운데 조밀한 교차 구조)
            for(let i=0; i<12; i++) {
                layers.inter.push({ x: 0, y: -150 + i*28, phase: Math.random() * Math.PI * 2, state: 0 });
            }
            // 운동 뉴런 (우측 출력층)
            for(let i=0; i<6; i++) {
                layers.motor.push({ x: 150, y: -75 + i*30, phase: Math.random() * Math.PI * 2, state: 0 });
            }
        }
        initNeurons();

        // 마우스 휠 스크롤로 크기 변경 이벤트 바인딩
        window.addEventListener('wheel', (e) => {
            e.preventDefault();
            let delta = e.deltaY * -0.002;
            targetScale = Math.min(Math.max(targetScale + delta, 0.2), 3.0);
            sizeSlider.value = targetScale;
        }, { passive: false });

        // 슬라이더 조작 반영
        sizeSlider.addEventListener('input', (e) => {
            targetScale = parseFloat(e.target.value);
        });

        // 애니메이션 루프
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 부드러운 크기 변환 보간 (Lerp)
            currentScale += (targetScale - currentScale) * 0.1;
            scaleVal.textContent = currentScale.toFixed(2) + 'x';

            // 크기에 따른 신경망 활성화 특성 물리 변화 연출
            // 크기가 작아질수록(마이크로 세계로 갈수록) 신호 전달 속도와 주파수가 급증하도록 설정
            let speedMultiplier = 1.0 / (currentScale * 0.7); 
            pulseTime += 0.05 * speedMultiplier;

            if(currentScale < 0.6) {
                firingVal.textContent = "🔥 초고속 발화";
                firingVal.style.color = "#ff7b72";
            } else if(currentScale > 1.8) {
                firingVal.textContent = "💤 저전력 동면";
                firingVal.style.color = "#79c0ff";
            } else {
                firingVal.textContent = "Normal (안정)";
                firingVal.style.color = "#58a6ff";
            }

            // 화면 중앙 좌표 설정
            const centerX = canvas.width / 2 + 100; // UI 창을 고려해 약간 우측 배치
            const centerY = canvas.height / 2;

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.scale(currentScale, currentScale);

            // 1. 초파리 가상 실루엣 및 외형선 그리기
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(240, 139, 36, 0.25)';
            ctx.lineWidth = 2;
            ctx.fillStyle = 'rgba(240, 139, 36, 0.03)';
            // 타원 형태의 가상 생체 격자
            ctx.ellipse(0, 0, 220, 180, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 날개 형태 가이드라인 연출
            ctx.beginPath();
            ctx.ellipse(-40, -140, 120, 50, -Math.PI/6, 0, Math.PI*2);
            ctx.ellipse(-40, 140, 120, 50, Math.PI/6, 0, Math.PI*2);
            ctx.strokeStyle = 'rgba(88, 166, 255, 0.15)';
            ctx.stroke();

            // 2. 시냅스 연결선 (Synapses) 업데이트 및 드로잉
            ctx.lineWidth = 1;
            // 감각층 -> 중앙층 연결
            layers.sensory.forEach((s, sIdx) => {
                s.state = Math.sin(pulseTime + s.phase);
                layers.inter.forEach((inter, iIdx) => {
                    // 간결한 연출을 위해 일부 무작위 망 연결선만 활성화
                    if ((sIdx + iIdx) % 3 === 0) {
                        let alpha = (s.state + 1) * 0.5 * 0.15;
                        ctx.strokeStyle = `rgba(88, 166, 255, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(s.x, s.y);
                        ctx.lineTo(inter.x, inter.y);
                        ctx.stroke();
                    }
                });
            });

            // 중앙층 -> 운동층 연결
            layers.inter.forEach((inter, iIdx) => {
                inter.state = Math.sin(pulseTime + inter.phase);
                layers.motor.forEach((m, mIdx) => {
                    if ((iIdx + mIdx) % 2 === 0) {
                        let alpha = (inter.state + 1) * 0.5 * 0.2;
                        ctx.strokeStyle = `rgba(46, 160, 67, ${alpha})`;
                        ctx.beginPath();
                        ctx.moveTo(inter.x, inter.y);
                        ctx.lineTo(m.x, m.y);
                        ctx.stroke();
                    }
                });
            });

            // 3. 뉴런 노드 (Neurons Node) 시각화
            // 감각 뉴런 (Cyan)
            layers.sensory.forEach(n => {
                let r = 4 + (n.state + 1) * 2;
                ctx.fillStyle = `rgba(88, 166, 255, ${0.4 + (n.state+1)*0.3})`;
                ctx.shadowBlur = r * 2;
                ctx.shadowColor = "#58a6ff";
                ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2); ctx.fill();
            });

            // 내부 처리 뉴런 (Purple)
            layers.inter.forEach(n => {
                let r = 3 + (n.state + 1) * 1.5;
                ctx.fillStyle = `rgba(187, 128, 255, ${0.5 + (n.state+1)*0.25})`;
                ctx.shadowBlur = r * 2;
                ctx.shadowColor = "#bc8cff";
                ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2); ctx.fill();
            });

            // 운동 뉴런 (Green)
            layers.motor.forEach(n => {
                let r = 5 + (Math.sin(pulseTime + n.phase) + 1) * 2;
                ctx.fillStyle = `rgba(57, 211, 83, ${0.4 + (Math.sin(pulseTime + n.phase)+1)*0.3})`;
                ctx.shadowBlur = r * 2;
                ctx.shadowColor = "#39d353";
                ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI*2); ctx.fill();
            });

            ctx.restore();
            // 그림자 초기화
            ctx.shadowBlur = 0;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
